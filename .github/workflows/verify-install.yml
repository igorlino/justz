name: verify-install

# Installs the published release from every channel and runs it. It runs after
# each release and once a week, and opens an issue if something breaks.

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containers:
    name: containers (linux)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/verify-install.sh

  macos:
    name: homebrew (macos)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    steps:
      - run: |
          brew install igorlino/tap/justz
          justz --version
          justz doctor --json

  windows:
    name: archive (windows)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - name: Download the latest release archive and run it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view --repo igorlino/justz --json tagName --jq .tagName
          $version = $tag.TrimStart('v')
          gh release download $tag --repo igorlino/justz --pattern "justz-$version-windows-amd64.zip" --dir $env:RUNNER_TEMP
          Expand-Archive "$env:RUNNER_TEMP/justz-$version-windows-amd64.zip" -DestinationPath "$env:RUNNER_TEMP/justz"
          & "$env:RUNNER_TEMP/justz/justz.exe" --version
          & "$env:RUNNER_TEMP/justz/justz.exe" shim list --json

  report:
    name: open an issue on failure
    needs: [containers, macos, windows]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Install verification failed" \
            --label friction \
            --body "The install check failed after a release or on the weekly schedule. Details: $RUN_URL"
