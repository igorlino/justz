name: release

on:
  push:
    tags: ["v*"]

# Nothing runs concurrently for the same tag, and a release is never cancelled
# half way through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload assets
      id-token: write # sign attestations with the workflow identity
      attestations: write # store the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # 1. Build everything and upload it to a draft release.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Attest the archives and the checksums file.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-checksums.txt

      # 3. Publish. From here on the release is immutable.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false

  # Regenerates the Homebrew formula from the published checksums and pushes
  # it to igorlino/homebrew-tap.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update the Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release download "$TAG" --pattern '*-checksums.txt' --dir "$RUNNER_TEMP"
          sh scripts/render-formula.sh "$version" "$RUNNER_TEMP/justz-$version-checksums.txt" > "$RUNNER_TEMP/justz.rb"

          # Pass the token through the environment, never on a command line.
          basic="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"

          git clone --depth 1 https://github.com/igorlino/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp "$RUNNER_TEMP/justz.rb" "$RUNNER_TEMP/tap/Formula/justz.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/justz.rb
          if git diff --cached --quiet; then
            echo "Formula is already up to date"
            exit 0
          fi
          git commit -m "justz $version"
          git push origin HEAD:main
