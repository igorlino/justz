name: Feature idea
description: Suggest something justz could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Start with the situation, not the solution. What is hard or annoying today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Sketch how it might work, including an example command if you have one.
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried so far?
