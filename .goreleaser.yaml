version: 2

project_name: justz

builds:
  - id: justz
    main: ./cmd/justz
    binary: justz
    env:
      - CGO_ENABLED=0
    # A Windows binary carries its name, version and publisher in its resources, like
    # a signed program does. The generated resource_windows_<arch>.syso is picked up
    # by the Go build by its file name and is not committed.
    hooks:
      pre:
        - sh scripts/winres.sh {{ .Os }} {{ .Arch }} {{ .Major }} {{ .Minor }} {{ .Patch }} {{ .Version }}
    flags:
      - -trimpath
    # The binary is not stripped: unsigned, stripped Go binaries are more often
    # flagged by antivirus heuristics, and the size saved is small.
    ldflags:
      - -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: justz
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "justz-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "justz-{{ .Version }}-checksums.txt"
  algorithm: sha256

# Releases are created as drafts, then attested, then published by the
# workflow, so they stay compatible with immutable releases.
release:
  draft: true
  replace_existing_draft: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci(\\(deps\\))?:"
      - "^build\\(deps\\):"
